name: Keep Render Backend Awake 24/7

on:
  schedule:
    # Run every 10 minutes to prevent Render free-tier 15-minute sleep
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allow manual trigger from GitHub UI

jobs:
  ping-render:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Health Endpoint
        run: |
          TARGET_URL="${{ secrets.RENDER_BACKEND_URL || 'https://caselink-backend.onrender.com' }}"
          echo "Sending keep-alive ping to $TARGET_URL/health"
          curl -s -f -m 15 "$TARGET_URL/health" || echo "Ping failed or server waking up, will retry on next cycle"
